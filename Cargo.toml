[package]
name = "doom"
version = "0.1.0"
edition = "2024"
authors = []
description = "Polymorphic EDR/AV Evasion Payload Generator for Red Teams"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
zeroize = { version = "1.8", features = ["derive"] }
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
